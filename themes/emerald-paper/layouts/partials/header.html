<header class="site-header">
    <div class="header-inner">

        <a class="logo" href="{{ "/" | relURL }}">
            {{ .Site.Title }}
        </a>

        <nav>
            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}">{{ .Name }}</a>
            {{ end }}
        </nav>

    </div>
</header>
