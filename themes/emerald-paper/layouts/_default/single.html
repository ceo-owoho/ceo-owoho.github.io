{{ define "main" }}

<article class="article">

    {{ with .Params.image }}
    <div class="hero">
        <img src="{{ . }}" alt="{{ $.Title }}">
    </div>
    {{ end }}

    <div class="article-meta">

        <span class="category">{{ .Params.category }}</span>

        <time>{{ .Date.Format "02 Jan 2006" }}</time>

    </div>

    <h1>{{ .Title }}</h1>

    <div class="article-tags">

        {{ range .Params.tags }}
        <span>#{{ . }}</span>
        {{ end }}

    </div>

    <div class="content">
        {{ .Content }}
    </div>

</article>

{{ end }}
